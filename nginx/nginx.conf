events {
    worker_connections 1024;
}

http {
    # Allow uploads up to the backend's multipart max (treasure media: 25MB file / 30MB
    # request). Without this, nginx's 1MB default silently resets multipart uploads of real
    # photos before they reach the service, so the client sees no HTTP response at all.
    client_max_body_size 30m;

    # Reflect allowed origins back into Access-Control-Allow-Origin.
    # Permits the VM's IP on any port (e.g. :5173 for Vite) and localhost on any port.
    map $http_origin $cors_origin {
        default "";
        "~^http://161\.118\.252\.10(:[0-9]+)?$" $http_origin;
        "~^http://localhost(:[0-9]+)?$"        $http_origin;
        "~^http://127\.0\.0\.1(:[0-9]+)?$"     $http_origin;
    }

    upstream auth_service {
        server auth-service:8081;
    }

    upstream ai_service {
        server ai-service:8087;
    }

    upstream tracking_service {
        server tracking-service:8084;
    }

    upstream dashboard_service {
        server dashboard-service:8083;
    }

        upstream therapist_service {
        server therapist-api:8085;
    }

        upstream social_service {
        server social-api:8086;
    }

    upstream notification_service {
        server notification-service:8082;
    }

    server {
        listen 8080;
        server_name _;

        # CORS headers applied to all responses in this server (inherited by locations
        # that don't define their own add_header). "always" ensures they're sent for
        # 4xx/5xx and manual `return` responses too.
        add_header Access-Control-Allow-Origin      $cors_origin always;
        add_header Access-Control-Allow-Credentials true         always;
        add_header Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers     "Authorization, Content-Type, Accept, X-Requested-With" always;
        add_header Access-Control-Max-Age           3600 always;

        # Strip any CORS headers coming from upstream Spring services to avoid duplicates.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Max-Age;

        # Block internal endpoints from external access
        location /internal/ {
            return 403;
        }

        # Auth Service Routes
        location /api/v1/auth/ {
            if ($request_method = OPTIONS) { return 204; }
            proxy_pass http://auth_service/api/v1/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/patients/ {
            if ($request_method = OPTIONS) { return 204; }
            proxy_pass http://auth_service/api/v1/patients/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # AI Service Routes
        location /api/v1/ai/ {
            if ($request_method = OPTIONS) { return 204; }
            proxy_pass http://ai_service/api/v1/ai/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Tracking Service Routes
        location /api/v1/tracking/ {
            if ($request_method = OPTIONS) { return 204; }
            proxy_pass http://tracking_service/api/v1/tracking/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Dashboard Service Routes (BFF)
        location /api/v1/dashboard/ {
            if ($request_method = OPTIONS) { return 204; }
            proxy_pass http://dashboard_service/api/v1/dashboard/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Notification Service Routes
        location /api/v1/notification/ {
            if ($request_method = OPTIONS) { return 204; }
            proxy_pass http://notification_service/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Therapist API Routes
        location /api/v1/therapist/ {
            if ($request_method = OPTIONS) { return 204; }
            proxy_pass http://therapist_service/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Thesis Social Routes
        location /api/v1/social/ {
            if ($request_method = OPTIONS) { return 204; }
            proxy_pass http://social_service/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
