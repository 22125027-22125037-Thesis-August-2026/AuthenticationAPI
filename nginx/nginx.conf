events {
    worker_connections 1024;
}

http {
    # Allow uploads up to the backend's multipart max (treasure media: 25MB file / 30MB
    # request). Without this, nginx's 1MB default silently resets multipart uploads of real
    # photos before they reach the service, so the client sees no HTTP response at all.
    client_max_body_size 30m;

    # therapist-api, social-api, and notification-service live in sibling repos/stacks and
    # are not part of this docker-compose file. A static `upstream` block resolves its host
    # at nginx startup and fails to boot ("host not found in upstream") if that host doesn't
    # exist yet — which is exactly the case when this compose file runs standalone (e.g. for
    # this submission). Routing those three locations through a variable in proxy_pass instead
    # defers DNS resolution to request time via the `resolver` below, so nginx starts cleanly
    # either way; those routes simply 502 until the sibling stack is present.
    resolver 127.0.0.11 valid=10s;

    # Reflect allowed origins back into Access-Control-Allow-Origin.
    #
    # Only genuinely cross-origin callers need this: a laptop dev server
    # (`npm run dev`, see therapist-web-ui/.env.development) calling this VM.
    # The deployed web UI is served by Caddy at the domain root — the same origin
    # as this gateway — so its requests are same-origin and never consult this map.
    #
    # Deliberately no public host here: adding one would mean re-editing this file
    # on every IP/domain change, which is how the retired Oracle IP
    # (140.245.124.163) survived the Azure migration and silently broke CORS.
    map $http_origin $cors_origin {
        default "";
        "~^http://localhost(:[0-9]+)?$"        $http_origin;
        "~^http://127\.0\.0\.1(:[0-9]+)?$"     $http_origin;
    }

    upstream auth_service {
        server auth-service:8081;
    }

    upstream ai_service {
        server ai-service:8087;
    }

    upstream tracking_service {
        server tracking-service:8084;
    }

    upstream dashboard_service {
        server dashboard-service:8083;
    }

    upstream minio_storage {
        server minio:9000;
    }

    server {
        listen 8080;
        server_name _;

        # CORS headers applied to all responses in this server (inherited by locations
        # that don't define their own add_header). "always" ensures they're sent for
        # 4xx/5xx and manual `return` responses too.
        add_header Access-Control-Allow-Origin      $cors_origin always;
        add_header Access-Control-Allow-Credentials true         always;
        add_header Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers     "Authorization, Content-Type, Accept, X-Requested-With" always;
        add_header Access-Control-Max-Age           3600 always;

        # Strip any CORS headers coming from upstream Spring services to avoid duplicates.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Max-Age;

        # Block internal endpoints from external access
        location /internal/ {
            return 403;
        }

        # Auth Service Routes
        location /api/v1/auth/ {
            if ($request_method = OPTIONS) { return 204; }
            proxy_pass http://auth_service/api/v1/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/patients/ {
            if ($request_method = OPTIONS) { return 204; }
            proxy_pass http://auth_service/api/v1/patients/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # AI Service Routes
        location /api/v1/ai/ {
            if ($request_method = OPTIONS) { return 204; }
            proxy_pass http://ai_service/api/v1/ai/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Tracking Service Routes
        location /api/v1/tracking/ {
            if ($request_method = OPTIONS) { return 204; }
            proxy_pass http://tracking_service/api/v1/tracking/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Dashboard Service Routes (BFF)
        location /api/v1/dashboard/ {
            if ($request_method = OPTIONS) { return 204; }
            proxy_pass http://dashboard_service/api/v1/dashboard/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Notification Service Routes (separate repo/stack — see `resolver` note above)
        location /api/v1/notification/ {
            if ($request_method = OPTIONS) { return 204; }
            set $notification_upstream notification-service:8082;
            proxy_pass http://$notification_upstream/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Therapist API Routes (separate repo/stack — see `resolver` note above)
        location /api/v1/therapist/ {
            if ($request_method = OPTIONS) { return 204; }
            set $therapist_upstream therapist-api:8085;
            proxy_pass http://$therapist_upstream/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Thesis Social Routes (separate repo/stack — see `resolver` note above)
        location /api/v1/social/ {
            if ($request_method = OPTIONS) { return 204; }
            set $social_upstream social-api:8086;
            proxy_pass http://$social_upstream/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # MinIO object storage — serves presigned media GET URLs (treasure images/audio).
        # proxy_pass without a path preserves the URI (/mhsa-media/<key>), and Host is
        # forwarded unchanged so the SigV4 presigned-URL signature still validates at MinIO.
        # client_max_body_size is generous here in case uploads are ever routed this way too.
        location /mhsa-media/ {
            proxy_pass http://minio_storage;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
