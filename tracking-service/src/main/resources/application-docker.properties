# Server Configuration
server.port=8084
spring.application.name=tracking-service

# Database (separate PostgreSQL instance for Tracking service)
spring.datasource.url=jdbc:postgresql://postgres-tracking:5432/tracking_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Flyway Migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baselineOnMigrate=true

# Redis (shared for caching)
spring.data.redis.host=redis
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms
spring.data.redis.jedis.pool.max-active=8
spring.data.redis.jedis.pool.max-idle=8

# RabbitMQ Configuration
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.virtual-host=/

# JWT Configuration (loaded from shared-jwt library)
mhsa.app.jwtExpirationMs=3600000
mhsa.app.jwtIssuer=mhsa.backend
mhsa.app.jwtAudience=mhsa-api

# S3 Storage (treasure media: MinIO in dev, S3 in prod). Shares the mhsa-media bucket.
s3.endpoint=${S3_ENDPOINT:http://minio:9000}
s3.region=${S3_REGION:us-east-1}
s3.bucket=${S3_BUCKET:mhsa-media}
s3.access-key=${S3_ACCESS_KEY:minioadmin}
s3.secret-key=${S3_SECRET_KEY:minioadmin}
s3.path-style-access=${S3_PATH_STYLE_ACCESS:true}
# Public endpoint used only for presigned GET URLs handed to clients. The internal
# minio:9000 host is unreachable from devices, so deployed envs set this to the gateway
# (which proxies /mhsa-media/ to MinIO). Falls back to s3.endpoint for local dev.
s3.public-endpoint=${S3_PUBLIC_ENDPOINT:${s3.endpoint}}

# Multipart upload limits (Spring defaults to 1MB file / 10MB request, too small for
# treasure audio/video). Service-side cap on media is enforced in TreasureServiceImpl.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB

# Service URLs (for cross-service calls)
service.auth.url=http://auth-service:8081

# Auth-service grant replication (event stream + nightly reconciliation snapshot)
# Exchange name must match auth-service's mhsa.auth.events.exchange so the grant queues bind there.
mhsa.auth.events.exchange=${AUTH_EVENTS_EXCHANGE:auth.events}
auth.api.base-url=${AUTH_API_BASE_URL:http://auth-service:8081}
auth.api.grants-path=${AUTH_API_GRANTS_PATH:/internal/grants}
auth.api.page-size=${AUTH_API_PAGE_SIZE:200}

# Logging Configuration
logging.level.root=INFO
logging.level.com.mhsa.backend=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=DEBUG

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
