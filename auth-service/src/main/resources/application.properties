spring.application.name=auth-service
server.port=8081

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/auth_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baselineOnMigrate=true

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# JWT (property names consumed by shared-jwt JwtUtils + RefreshTokenService are mhsa.app.*)
mhsa.app.jwtPrivateKey=${JWT_PRIVATE_KEY:}
mhsa.app.jwtPublicKey=${JWT_PUBLIC_KEY:}
# Access token: short-lived (15 min). Clients refresh silently via /api/v1/auth/refresh.
mhsa.app.jwtExpirationMs=900000
# Refresh token: 30-day rolling window, 180-day absolute cap (set absolute <=0 to disable).
mhsa.app.jwtRefreshExpirationMs=2592000000
mhsa.app.jwtRefreshAbsoluteMs=15552000000
mhsa.app.jwtIssuer=mhsa.backend
mhsa.app.jwtAudience=mhsa-api
mhsa.app.jwtSigningKid=mhsa.app.jwtSigningKid

# S3 Storage (for avatars)
s3.endpoint=${S3_ENDPOINT:http://localhost:9000}
s3.region=${S3_REGION:us-east-1}
s3.bucket=${S3_BUCKET:mhsa-media}
s3.access-key=${S3_ACCESS_KEY}
s3.secret-key=${S3_SECRET_KEY}
s3.path-style-access=${S3_PATH_STYLE_ACCESS:true}

# Therapist-api integration (assignment read-model replica + nightly reconciliation)
therapist.api.exchange=${THERAPIST_API_EXCHANGE:booking.exchange}
therapist.api.base-url=${THERAPIST_API_BASE_URL:http://therapist-api:8085}
therapist.api.assignments-path=${THERAPIST_API_ASSIGNMENTS_PATH:/internal/assignments}
therapist.api.page-size=${THERAPIST_API_PAGE_SIZE:200}

# Logging
logging.level.root=INFO
logging.level.com.mhsa.backend=DEBUG
