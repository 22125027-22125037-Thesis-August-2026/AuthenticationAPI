# Memory ceilings target an 8 GiB host. A Spring Boot JVM with no -Xmx claims 25% of host RAM
# for its heap; seven of them on one box overcommits it several times over. JAVA_TOOL_OPTIONS
# uses MaxRAMPercentage rather than a literal -Xmx so each heap is derived from the mem_limit
# beneath it (the JVM reads the cgroup) and the two can never drift apart.
#
# MaxMetaspaceSize is NOT part of the heap and is not covered by MaxRAMPercentage — it must be
# budgeted on top of it. An earlier 128m ceiling was too small for auth-service (Security + JPA +
# Redis + Rabbit + CGLIB proxies): it exhausted Metaspace ~1h after boot and threw OutOfMemoryError
# on every request thread, which reads as a 504 hang rather than a crash because the JVM survives.
# 256m metaspace + 45% heap keeps each service inside its 1g ceiling with room for code cache and
# thread stacks.
services:
  nginx:
    image: nginx:1.25-alpine
    container_name: nginx
    mem_limit: 64m
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      auth-service:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      tracking-service:
        condition: service_healthy
      dashboard-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - mhsa-network
      - umatter-shared

  postgres-auth:
    image: postgres:16-alpine
    container_name: postgres-auth
    mem_limit: 256m
    restart: unless-stopped
    command: postgres -c shared_buffers=32MB -c max_connections=50
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5431:5432"
    volumes:
      - postgres-auth-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mhsa-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    mem_limit: 384m
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_ENHANCED_PASSWORD_FIELD: "False"
    ports:
      - "5051:80"
    depends_on:
      postgres-auth:
        condition: service_healthy
      postgres-ai:
        condition: service_healthy
      postgres-tracking:
        condition: service_healthy
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - mhsa-network

  redis:
    image: redis:7-alpine
    container_name: redis
    mem_limit: 128m
    restart: unless-stopped
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru
    ports:
      - "6371:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mhsa-network

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: rabbitmq
    mem_limit: 384m
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5671:5672"
      - "15671:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mhsa-network

  postgres-ai:
    image: postgres:16-alpine
    container_name: postgres-ai
    mem_limit: 256m
    restart: unless-stopped
    command: postgres -c shared_buffers=32MB -c max_connections=50
    environment:
      POSTGRES_DB: ai_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5437:5432"
    volumes:
      - postgres-ai-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mhsa-network

  postgres-tracking:
    image: postgres:16-alpine
    container_name: postgres-tracking
    mem_limit: 256m
    restart: unless-stopped
    command: postgres -c shared_buffers=32MB -c max_connections=50
    environment:
      POSTGRES_DB: tracking_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres-tracking-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mhsa-network

  minio:
    image: minio/minio:latest
    container_name: minio
    mem_limit: 512m
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - mhsa-network

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set minio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb minio/mhsa-media --ignore-existing;
      /usr/bin/mc version enable minio/mhsa-media;
      echo 'MinIO bucket mhsa-media initialized successfully'
      "
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - mhsa-network

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile.build
    container_name: auth-service
    mem_limit: 1g
    restart: unless-stopped
    env_file:
      - .env
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=45 -XX:MaxMetaspaceSize=256m -XX:+UseSerialGC -Xss512k"
      SERVER_PORT: 8081
      SPRING_APPLICATION_NAME: auth-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-auth:5432/auth_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration
      SPRING_FLYWAY_BASELINEONMIGRATE: "true"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      MHSA_APP_JWTEXPIRATIONMS: 3600000
      MHSA_APP_JWTISSUER: mhsa.backend
      MHSA_APP_JWTAUDIENCE: mhsa-api
      MHSA_APP_JWTSIGNINGKID: mhsa.app.jwtSigningKid
      MHSA_APP_JWTALLOWHZ256FALLBACK: "false"
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: mhsa-media
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_PATH_STYLE_ACCESS: "true"
      # Therapist-api integration: shared booking.exchange for assignment events, and the
      # therapist-api host:port (8085) reached over the umatter-shared network for nightly reconcile.
      THERAPIST_API_EXCHANGE: booking.exchange
      THERAPIST_API_BASE_URL: http://therapist-api:8085
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_COM_MHSA_BACKEND: INFO
    ports:
      - "8081:8081"
    depends_on:
      postgres-auth:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - mhsa-network
      - umatter-shared

  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile.build
    container_name: ai-service
    mem_limit: 1g
    restart: unless-stopped
    env_file:
      - .env
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=45 -XX:MaxMetaspaceSize=256m -XX:+UseSerialGC -Xss512k"
      SERVER_PORT: 8087
      SPRING_APPLICATION_NAME: ai-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-ai:5432/ai_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration
      SPRING_FLYWAY_BASELINEONMIGRATE: "true"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      MHSA_APP_JWTEXPIRATIONMS: 3600000
      MHSA_APP_JWTISSUER: mhsa.backend
      MHSA_APP_JWTAUDIENCE: mhsa-api
      MHSA_APP_JWTSIGNINGKID: mhsa.app.jwtSigningKid
      # Verification keys are resolved from Auth's published key set by kid. AI never signs,
      # so it is given no key material — see ai-service/entrypoint.sh.
      MHSA_APP_JWKSENDPOINT: http://auth-service:8081/internal/v1/.well-known/jwks.json
      SERVICE_TRACKING_URL: http://tracking-service:8084
      SERVICE_AUTH_URL: http://auth-service:8081
      GEMINI_API_URL: https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_COM_MHSA_BACKEND: INFO
    ports:
      - "8087:8087"
    depends_on:
      postgres-ai:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      tracking-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8087/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - mhsa-network

  tracking-service:
    build:
      context: .
      dockerfile: tracking-service/Dockerfile.build
    container_name: tracking-service
    mem_limit: 1g
    restart: unless-stopped
    env_file:
      - .env
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=45 -XX:MaxMetaspaceSize=256m -XX:+UseSerialGC -Xss512k"
      SERVER_PORT: 8084
      SPRING_APPLICATION_NAME: tracking-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-tracking:5432/tracking_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration
      SPRING_FLYWAY_BASELINEONMIGRATE: "true"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      MHSA_APP_JWTEXPIRATIONMS: 3600000
      MHSA_APP_JWTISSUER: mhsa.backend
      MHSA_APP_JWTAUDIENCE: mhsa-api
      MHSA_APP_JWTSIGNINGKID: mhsa.app.jwtSigningKid
      # Verification keys are resolved from Auth's published key set by kid. Tracking never
      # signs, so it is given no key material — see tracking-service/entrypoint.sh.
      MHSA_APP_JWKSENDPOINT: http://auth-service:8081/internal/v1/.well-known/jwks.json
      SERVICE_AUTH_URL: http://auth-service:8081
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: mhsa-media
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_PATH_STYLE_ACCESS: "true"
      # Public gateway base used for presigned media URLs (nginx proxies /mhsa-media/ to MinIO).
      # The internal minio:9000 host is unreachable from mobile devices.
      S3_PUBLIC_ENDPOINT: https://umatter-apcs.duckdns.org
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_COM_MHSA_BACKEND: INFO
    ports:
      - "8084:8084"
    depends_on:
      postgres-tracking:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8084/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - mhsa-network

  dashboard-service:
    build:
      context: .
      dockerfile: dashboard-service/Dockerfile.build
    container_name: dashboard-service
    mem_limit: 1g
    restart: unless-stopped
    env_file:
      - .env
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=45 -XX:MaxMetaspaceSize=256m -XX:+UseSerialGC -Xss512k"
      SERVER_PORT: 8083
      SPRING_APPLICATION_NAME: dashboard-service
      MHSA_APP_JWTEXPIRATIONMS: 3600000
      MHSA_APP_JWTISSUER: mhsa.backend
      MHSA_APP_JWTAUDIENCE: mhsa-api
      # Dashboard verifies tokens but never issues them, so it is handed no signing material
      # at all — it resolves Auth's public key by kid from the published set. Rotating the
      # key pair therefore does not require redeploying this service.
      MHSA_APP_JWKSENDPOINT: http://auth-service:8081/internal/v1/.well-known/jwks.json
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_COM_MHSA_BACKEND: INFO
    ports:
      - "8083:8083"
    depends_on:
      auth-service:
        condition: service_healthy
      tracking-service:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8083/api/v1/dashboard/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - mhsa-network

volumes:
  postgres-auth-data:
  postgres-ai-data:
  postgres-tracking-data:
  minio-data:
  pgadmin-data:

networks:
  mhsa-network:
    driver: bridge
  umatter-shared:
    external: true
